<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Church Radar — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at 50% 30%, #0a1624, #04070d 70%);
        color: #e8f1ff;
        font: 15px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 { font-size: 1.15rem; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 0.6rem; }
      p { margin: 0 0 1.4rem; color: #9db2cd; max-width: 22rem; }
      button {
        font: inherit;
        font-weight: 600;
        color: #04121a;
        background: #2fe27c;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.6rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Church Radar</h1>
      <p>
        The radar needs a connection to load churches and live check-ins. Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
