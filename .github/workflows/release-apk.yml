name: Release APK

# Orion Store and every APK download resolve from GitHub releases, so pushing a
# tag is the whole release: this builds the signed APK, checksums it, and
# attaches both to the release for that tag.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 -w0 android/church-radar-release.jks
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias (churchradar)
#   ANDROID_KEY_PASSWORD       key password
#
# Run it manually from the Actions tab (workflow_dispatch) to verify the
# toolchain without publishing: that build stops at an uploaded artifact and
# never touches a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # `packages` replaces a bare `sdkmanager` call: setup-android@v3 defaulted to
      # `tools platform-tools`, and the standalone `tools` package no longer exists
      # in the SDK repository, so it exited 1 before anything was built.
      # Space-separated on ONE line — the action splits the input on single spaces.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and sync the native project
        run: npm run build && npx cap sync android

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storeFile=../release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build the release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --console=plain

      - name: Name and checksum the APK
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          cp android/app/build/outputs/apk/release/app-release.apk "ChurchRadar-$VERSION.apk"
          sha256sum "ChurchRadar-$VERSION.apk" > "ChurchRadar-$VERSION.apk.sha256"
          cat "ChurchRadar-$VERSION.apk.sha256"

      # Manual runs stop here: the APK is downloadable from the run, and no
      # release is touched.
      - name: Upload APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ChurchRadar-apk
          path: |
            ChurchRadar-*.apk
            ChurchRadar-*.apk.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ChurchRadar-*.apk
            ChurchRadar-*.apk.sha256
          generate_release_notes: true
